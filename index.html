<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR受付スキャナー</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 0; transition: background 0.3s; }
    #container { padding: 20px; }
    #video-container { position: relative; width: 100%; max-width: 400px; margin: 20px auto; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    video { width: 100%; vertical-align: bottom; }
    #status { margin-top: 20px; font-weight: bold; font-size: 1.4em; min-height: 1.5em; }
    #info { font-size: 1.1em; color: #555; margin-top: 10px; }
    .success { background-color: #28a745 !important; color: white; }
    .error { background-color: #dc3545 !important; color: white; }
    .warning { background-color: #ffc107 !important; color: #212529; }
    .success #info, .error #info { color: white; }
  </style>
</head>
<body>
  <div id="container">
    <h2>QR受付システム</h2>
    <div id="video-container">
      <video id="video" playsinline></video>
    </div>
    <div id="status">スキャン待機中...</div>
    <div id="info">ConnpassのQRコードをかざしてください</div>
  </div>

  <script>
    // --- 設定: ここにデプロイしたGASのURLを貼り付けてください ---
    const GAS_URL = "ここにコピーしたGASのURLを貼り付け";

    const video = document.getElementById('video');
    const statusDiv = document.getElementById('status');
    const infoDiv = document.getElementById('info');
    let isScanning = true;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
      video.srcObject = stream;
      video.play();
      requestAnimationFrame(tick);
    });

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
        const canvas = document.createElement("canvas");
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height);

        if (code) {
          handleScan(code.data);
        }
      }
      requestAnimationFrame(tick);
    }

    async function handleScan(rawData) {
      isScanning = false;
      statusDiv.innerText = "照合中...";
      
      const id = rawData.split('/').pop();

      try {
        // GASウェブアプリへのリクエスト (CORS対応)
        const response = await fetch(`${GAS_URL}?id=${id}`);
        const res = await response.json();
        
        applyResult(res);
      } catch (e) {
        alert("通信エラーが発生しました。GASのURLと公開設定を確認してください。");
        console.error(e);
        resetScan();
      }
    }

    function applyResult(res) {
      document.body.className = res.status === "success" ? "success" : 
                               res.status === "already" ? "warning" : "error";
      statusDiv.innerText = res.status === "success" ? "成功！" : 
                            res.status === "already" ? "確認済み" : "エラー";
      infoDiv.innerText = res.message;
      
      // 音声フィードバック
      const freq = res.status === "success" ? 880 : 220;
      beep(300, freq);

      // 3秒後にスキャン再開
      setTimeout(resetScan, 3000);
    }

    function resetScan() {
      document.body.className = "";
      statusDiv.innerText = "スキャン待機中...";
      infoDiv.innerText = "次の参加者のQRをかざしてください";
      isScanning = true;
    }

    function beep(dur, freq) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + dur/1000);
      osc.stop(ctx.currentTime + dur/1000);
    }
  </script>
</body>
</html>
