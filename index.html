<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 0; transition: background 0.3s; }
    #container { padding: 20px; }
    #video-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto; }
    video { width: 100%; border-radius: 8px; border: 4px solid #ccc; }
    #status-display { margin-top: 20px; font-weight: bold; font-size: 1.2em; min-height: 1.5em; }
    .success { background-color: #d4edda !important; color: #155724; }
    .error { background-color: #f8d7da !important; color: #721c24; }
    .warning { background-color: #fff3cd !important; color: #856404; }
    #loading { color: #666; }
  </style>
</head>
<body>
  <div id="container">
    <h2>受付スキャナー</h2>
    <div id="video-container">
      <video id="video" playsinline></video>
    </div>
    <div id="status-display">カメラを起動中...</div>
    <p id="user-info"></p>
  </div>

  <script>
    const video = document.getElementById('video');
    const statusDisplay = document.getElementById('status-display');
    const userInfo = document.getElementById('user-info');
    const body = document.body;
    let isScanning = true;

    // カメラのセットアップ
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then((stream) => {
      video.srcObject = stream;
      video.setAttribute("playsinline", true);
      video.play();
      requestAnimationFrame(tick);
    });

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && isScanning) {
        const canvas = document.createElement("canvas");
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);

        if (code) {
          processCode(code.data);
        }
      }
      requestAnimationFrame(tick);
    }

    function processCode(data) {
      isScanning = false; // 二重読み取り防止
      statusDisplay.innerText = "照合中...";
      
      // ConnpassのURL等からIDを抽出するロジック（環境に合わせて調整可）
      // ここでは簡易的に読み取った値そのものをIDとして送信
      const id = data.split('/').pop(); 

      google.script.run
        .withSuccessHandler((res) => {
          handleResult(res);
          // 2秒後にスキャン再開
          setTimeout(() => { resetUI(); }, 2000);
        })
        .updateAttendance(id);
    }

    function handleResult(res) {
      if (res.status === "success") {
        body.className = "success";
        statusDisplay.innerText = "成功！";
        userInfo.innerText = res.name + " さん、ようこそ！";
        beep(200, 440); // ピッ
      } else if (res.status === "already") {
        body.className = "warning";
        statusDisplay.innerText = "警告：受付済み";
        userInfo.innerText = res.name + " さんは既にチェックインしています。";
        beep(400, 220); // ブッ
      } else {
        body.className = "error";
        statusDisplay.innerText = "エラー：未登録";
        userInfo.innerText = "このQRコードは名簿に存在しません。";
        beep(400, 220); // ブッ
      }
    }

    function resetUI() {
      body.className = "";
      statusDisplay.innerText = "スキャン待機中...";
      userInfo.innerText = "";
      isScanning = true;
    }

    // 音声フィードバック用
    function beep(duration, frequency) {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
      oscillator.connect(audioCtx.destination);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + (duration / 1000));
    }
  </script>
</body>
</html>
