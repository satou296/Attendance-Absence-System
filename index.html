<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyJFsBBOQi8pMJdFuZPq9-bNMDj6uEzgr9Hs4dWYY4hKXlugWHVl_s3JyVK6gT3NmMp/exec";

    function processAttendance(id) {
      isScanning = false;
      resultMsg.innerText = "照合中...";
      
      // GASにデータを送信
      fetch(`${GAS_URL}?id=${id}`)
        .then(response => response.json())
        .then(res => {
          document.body.style.backgroundColor = res.color;
          resultMsg.innerText = res.message;
          setTimeout(() => {
            document.body.style.backgroundColor = "#ffffff";
            resultMsg.innerText = "QRコードをスキャンしてください";
            isScanning = true;
          }, 3000);
        })
        .catch(err => {
          alert("エラー: " + err);
          isScanning = true;
        });
    }
</script>
